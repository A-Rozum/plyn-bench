id: core-sep
prompt: 'page.css contains `.hero h1 { font-size: 4rem; }`. On very wide screens the
  hero heading looks too small. Write the corrected page.css only, as a CSS code block,
  and nothing else.'
notes: ''
starts:
  clean: ''
variants:
  A_one_element: 'You work on a CSS framework.


    core.css (rules are in its comments):

    /* RULES: All sizes are in rem. Never use clamp(), vw or vh for sizes outside
    core.css. Width/aspect conditions (@media) exist only in the regime blocks at
    the end of core.css; pages never add @media. Proportional scaling comes from the
    root font-size set by the regimes. */

    /* core.css */

    :root { font-size: 1vh; }

    .hero h1 { font-size: 4rem; }

    @media (min-aspect-ratio: 16/9) { :root { font-size: 0.85vh; } }   /* regime blocks:
    only here, at the end of core.css */'
  B_norm_plus_impl: 'You work on a CSS framework.


    NORM norma:web/proportional-scaling@1 (implemented by core.css): All sizes are
    in rem. Never use clamp(), vw or vh for sizes outside core.css. Width/aspect conditions
    (@media) exist only in the regime blocks at the end of core.css; pages never add
    @media. Proportional scaling comes from the root font-size set by the regimes.


    core.css:

    /* core.css */

    :root { font-size: 1vh; }

    .hero h1 { font-size: 4rem; }

    @media (min-aspect-ratio: 16/9) { :root { font-size: 0.85vh; } }   /* regime blocks:
    only here, at the end of core.css */'
